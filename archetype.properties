# Parameters used to generate this project with aem-project-archetype

groupId=com.micron
artifactId=micron
version=1.0.0-SNAPSHOT
package=com.micron.core
appId=micron
appTitle=Micron
aemVersion=cloud
sdkVersion=latest
languageCountry=${languageCountry}
